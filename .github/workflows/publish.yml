name: Scheduled Reel Publisher

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
      timezone: 'Asia/Karachi'
  workflow_dispatch:

concurrency:
  group: scheduled-reel-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Publish one due reel
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          REELS_DAILY_LIMIT: ${{ secrets.REELS_DAILY_LIMIT }}
          REELS_MIN_INTERVAL_MINUTES: ${{ secrets.REELS_MIN_INTERVAL_MINUTES }}
          FB_PUBLISH_ENABLED: ${{ secrets.FB_PUBLISH_ENABLED }}
          CLOUD_BATCH_PUBLIC_ID: ${{ secrets.CLOUD_BATCH_PUBLIC_ID }}
          CLOUD_STATE_PUBLIC_ID: ${{ secrets.CLOUD_STATE_PUBLIC_ID }}
          CLOUD_STATE_ENABLED: '1'
          PYTHONUNBUFFERED: '1'
        run: python cron_entry.py

