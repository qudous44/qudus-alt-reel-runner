name: Temporary Sid Cleanup

on:
  workflow_dispatch:

jobs:
  delete-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q requests
      - name: Delete published media
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
        run: python delete_sid_posts.py
